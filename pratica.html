<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area de Login</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
        <h1>Meta Escola</h1>
        <p>Área do aluno</p>
    </header>
    <main>
        <section class="login">
            <h2>Faça seu Login</h2>
            <p class="descricao">Digite seu nome e senha para acessar o portal:</p>
            <form action="">
                
                <label for="email">Seu email:</label>
                <input type="email" name="" id="email" placeholder="Digite seu Email">
                
                <label for="senha">Senha:</label>
                <input type="password" name="" id="senha" placeholder="Digite sua senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="#">Cadastre-se</a>
            </p>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Maicon Vinício - Todos os direitos reservados
        </p>
    </footer>
  </body>
</html>
